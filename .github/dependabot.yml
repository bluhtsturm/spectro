# Haelt requirements-lock.txt, die Actions und das Basis-Image aktuell.
# Jede Aktualisierung kommt als Pull Request und laeuft durch die volle CI.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
