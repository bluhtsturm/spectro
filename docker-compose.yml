services:
  spectro:
    # Fertiges Image aus der GitHub-Registry. Fuer eigene Aenderungen die
    # naechste Zeile auskommentieren und stattdessen "build: ." verwenden.
    image: ${IMAGE:-ghcr.io/bluhtsturm/spectro}:${TAG:-latest}
    # build: .
    container_name: spectro
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      MEDIA_DIRS: "${MEDIA_DIRS:-Musik=/media/musik}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-1024}"
      CACHE_MAX_MB: "${CACHE_MAX_MB:-2048}"
      MAX_RENDERS: "${MAX_RENDERS:-2}"
      SHOW_ALL_FILES: "${SHOW_ALL_FILES:-0}"
      SIDECAR: "${SIDECAR:-1}"
      LANG_DEFAULT: "${LANG_DEFAULT:-de}"
      AUTH_USER: "${AUTH_USER:-}"
      AUTH_PASS: "${AUTH_PASS:-}"
    volumes:
      # Medienordner immer read-only einhaengen - spectro schreibt dort nie.
      # Pfade in .env setzen; weitere Ordner einfach ergaenzen und in
      # MEDIA_DIRS mit Label aufnehmen.
      - "${MUSIC_DIR:-./musik}:/media/musik:ro"
      - "${RIPS_DIR:-./musik}:/media/rips:ro"
      # Uploads und PNG-Cache
      - spectro-data:/data
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  spectro-data:
